[pytest]
minversion = 7.0
addopts = -q -ra --strict-markers -m "not live and not order_dependent"

testpaths =
    tests

pythonpath =
    src

# Keep marker list explicit to avoid accidental typos.
markers =
    unit: unit tests
    integration: integration tests
    live: starts the app and hits real HTTP endpoints; deselected by default (see issue #183)
    order_dependent: passes in isolation but fails in full-suite order; deselected by default (see issue #183)
