[tool.poetry]
name = "lucy"
version = "0.1.0"
description = "a chat agent based that uses openai completion"
authors = ["junwin <jdunwin@gmail.com>"]
readme = "README.md"
# The import package is named `src` throughout Lucy; Poetry otherwise looks
# for a directory named after the distribution (`lucy`).
packages = [{ include = "src" }]

[tool.poetry.dependencies]
python = "^3.11"

# Test dependencies (used by pytest)
pytest = "^8.0.0"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q"
testpaths = ["tests"]
python_files = ["test_*.py"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
