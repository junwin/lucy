name: issue-resolution
type: sequence

children:
  - id: clarity
    name: Requirement clarity
    type: condition
    agent: lucy
    context: lucyproject
    max_attempts: 1
    instructions: |
      Review the GitHub issue and determine whether the requirement is
      sufficiently clear to implement.

      Return only a JSON object with:
        outcome: success | failed | blocked | inconclusive
        result: a concise explanation
    on:
      success: design
      failed: exit
      blocked: exit
      inconclusive: exit

  - id: design
    name: Create design
    type: tasklist
    agent: lucy
    context: lucyproject
    max_attempts: 2
    instructions: |
      Produce a concise implementation design for the issue.

      If review feedback is supplied, revise the design to address it.
      Return only a JSON object with:
        outcome: success | failed | blocked | inconclusive
        result: the design or explanation

  - id: review
    name: Review design
    type: condition
    agent: lucy
    context: lucyproject
    max_attempts: 2
    instructions: |
      Review the proposed design for correctness, scope, and implementability.
      Return only a JSON object with:
        outcome: success | failed | blocked | inconclusive
        result: concise review feedback
    on:
      success: complete
      failed: design
      blocked: exit
      inconclusive: exit
